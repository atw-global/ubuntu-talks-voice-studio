# Password-protected OpenSpeakers frontend preview.
# Intentionally do not connect API, WebSocket, jobs or GPUs until secured backend is deployed.
server {
    listen 10000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    auth_basic "Ubuntu Talks Voice Studio - Preview";
    auth_basic_user_file /etc/nginx/.voice-studio-htpasswd;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
        default_type application/json;
        return 503 '{"error":"voice_studio_backend_not_configured","message":"Audio generation and GPU provisioning are not yet enabled."}';
    }

    location /ws/ {
        default_type application/json;
        return 503 '{"error":"voice_studio_backend_not_configured"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
